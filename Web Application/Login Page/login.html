<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/Login Page/login.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <header class="navbar">

        <div class="container">

            <div class="logo">

                <div class="logo-icon">L</div>

                <h2>LuxeCraft</h2>

            </div>

            <nav>

                <ul class="nav-links">

                    <li><a href="/Main Page/index.html">Home</a></li>
                    <li><a href="/Product Page/products.html">Sofas</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>

                </ul>

            </nav>

            <div class="nav-right">

                <button class="icon-btn1">🔍</button>

                <button class="icon-btn1 cart1">🛒<span class="badge">2</span></button>

                <button class="login-btn1">Login</button>

                <button class="signup-btn1">Sign Up</button>

            </div>

        </div>

    </header>

    <!-- ***************************************************************************************************************** -->

    <section class="login-section">

        <div class="login-container">

            <div class="login-image">

                <img src="/images/MainSofaImage.jpg" alt="Luxury Sofa">

                <div class="overlay">

                    <h2>Crafted For Luxury Living</h2>

                    <p>Experience premium comfort with our handcrafted sofas.</p>

                </div>

            </div>

            <div class="login-form">

                <h2>Welcome Back</h2>

                <p>Login to continue shopping.</p>

                <form id="loginForm">

                    <label>Email Address</label>

                    <input type="email" id="email" class="form-input" placeholder="Enter your email">

                    <label>Password</label>

                    <div class="password-box">

                        <input type="password" class="form-input" id="password" placeholder="Enter your password">

                        <i class="fa-solid fa-eye" id="togglePassword"></i>

                    </div>

                    <div class="login-options">

                        <label><input type="checkbox">Remember Me</label>

                        <a href="/Forgot Password Page/forgot-page.html">Forgot Password?</a>

                    </div>

                    <button type="submit" class="login-btn" id="login-btn"> Login</button>

                </form>

                <p class="register-link">Don't have an account?<a href="/Register Page/register.html">Sign Up</a></p>

            </div>

        </div>

    </section>





    <script src="/Login Page/login.js"></script>

</body>

</html>
