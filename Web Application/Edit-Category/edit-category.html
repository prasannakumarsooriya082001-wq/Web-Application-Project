<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Category</title>

    <link rel="stylesheet" href="/Edit-Category/edit-category.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="container">

        <header>

            <h1>Edit Category</h1>

            <a href="/Admin-Categories/admin-categories.html" class="back-btn">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Categories

            </a>

        </header>

        <form id="categoryForm" class="card">

            <!-- Category Name -->

            <div class="form-group">

                <label>Category Name</label>

                <input type="text" id="categoryName" value="Luxury Sofa" required>

            </div>

            <!-- Category ID -->

            <div class="form-group">

                <label>Category ID</label>

                <input type="text" id="categoryId" value="CAT001" readonly>

            </div>

            <!-- Description -->

            <div class="form-group">

                <label>Description</label>

                <textarea id="description" rows="5"
                    required>Premium leather sofa collection with luxury designs.</textarea>

            </div>

            <!-- Total Products -->

            <div class="form-group">

                <label>Total Products</label>

                <input type="number" id="totalProducts" value="18">

            </div>

            <!-- Status -->

            <div class="form-group">

                <label>Status</label>

                <select id="status">

                    <option selected>Active</option>

                    <option>Inactive</option>

                </select>

            </div>

            <!-- Buttons -->

            <div class="button-group">

                <button type="submit" class="update-btn">

                    <i class="fa-solid fa-pen-to-square"></i>

                    Update Category

                </button>

                <button type="button" class="cancel-btn">

                    <i class="fa-solid fa-xmark"></i>

                    Cancel

                </button>

            </div>

        </form>

    </div>

    <script src="/Edit-Category/edit-category.js"></script>

</body>

</html>
