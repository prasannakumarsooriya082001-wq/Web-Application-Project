<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Customer</title>

    <link rel="stylesheet" href="/Edit-Customers/edit-customers.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="admin-container">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-logo">

                <div class="logo-icon">L</div>

                <h2>LuxeCraft</h2>

            </div>

            <ul class="sidebar-menu">

                <li>
                    <a href="/Dashboard/dashboard.html">
                        <i class="fa-solid fa-house"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="/Admin-Products/admin-products.html">
                        <i class="fa-solid fa-box"></i>
                        Products
                    </a>
                </li>

                <li>
                    <a href="/Admin-Orders/admin-orders.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Orders
                    </a>
                </li>

                <li class="active">
                    <a href="/Admin-Customers/admin-customers.html">
                        <i class="fa-solid fa-users"></i>
                        Customers
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="fa-solid fa-layer-group"></i>
                        Categories
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="fa-solid fa-chart-line"></i>
                        Reports
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="fa-solid fa-gear"></i>
                        Settings
                    </a>
                </li>

                <li>
                    <a href="/Login Page/login.html">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </a>
                </li>

            </ul>

        </aside>

        <!-- Main Content -->

        <main class="main-content">

            <div class="top-header">

                <div>

                    <h1>Edit Customer</h1>

                    <p>Update customer information.</p>

                </div>

                <a href="/Admin-Customers/admin-customers.html" class="back-btn">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back

                </a>

            </div>

            <div class="form-card">

                <form id="customerForm">

                    <div class="form-grid">

                        <div class="input-group">

                            <label>Full Name</label>

                            <input type="text" id="customerName" value="Prasanna Kumar">

                        </div>

                        <div class="input-group">

                            <label>Email</label>

                            <input type="email" id="email" value="prasanna@gmail.com">

                        </div>

                        <div class="input-group">

                            <label>Phone</label>

                            <input type="text" id="phone" value="9876543210">

                        </div>

                        <div class="input-group">

                            <label>Status</label>

                            <select id="status">

                                <option selected>Active</option>

                                <option>Inactive</option>

                            </select>

                        </div>

                        <div class="input-group full-width">

                            <label>Address</label>

                            <textarea id="address" rows="4">12, Anna Nagar, Madurai, Tamil Nadu - 625020</textarea>

                        </div>

                    </div>

                    <div class="button-group">

                        <button type="submit" class="save-btn">Update Customer</button>

                        <button type="button" class="cancel-btn">Cancel</button>

                    </div>

                </form>

            </div>

        </main>

    </div>

    <script src="/Edit-Customers/edit-customers.js"></script>

</body>

</html>
