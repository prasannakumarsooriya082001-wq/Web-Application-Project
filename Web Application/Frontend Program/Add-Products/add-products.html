<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product | LuxeCraft Admin</title>

    <link rel="stylesheet" href="/Add-Products/add-products.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="admin-container">

        <aside class="sidebar">

            <div class="sidebar-logo">

                <div class="logo-icon">L</div>

                <h2>LuxeCraft</h2>

            </div>

            <ul class="sidebar-menu">

                <li>
                    <a href="/Dashboard/dashboard.html">
                        <i class="fa-solid fa-house"></i>
                        Dashboard
                    </a>
                </li>

                <li class="active">
                    <a href="/Admin-Products/admin-products.html">
                        <i class="fa-solid fa-box"></i>
                        Products
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Orders
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="fa-solid fa-users"></i>
                        Customers
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="fa-solid fa-layer-group"></i>
                        Categories
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="fa-solid fa-chart-line"></i>
                        Reports
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="fa-solid fa-gear"></i>
                        Settings
                    </a>
                </li>

                <li>
                    <a href="/Login Page/login.html">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </a>
                </li>

            </ul>

        </aside>

        <!-- ******************************************************************************* -->

        <main class="main-content">

            <div class="page-header">

                <div>

                    <h1>Add New Product</h1>

                    <p>Add a new sofa product to your inventory.</p>

                </div>

                <a href="/Admin-Products/admin-products.html" class="back-btn">

                    <i class="fa-solid fa-arrow-left"></i>Back to Products

                </a>

            </div>

            <form class="product-form" id="productForm">

                <div class="form-group full-width">

                    <label>Product Image</label>

                    <div class="image-upload">

                        <img src="/images/upload-placeholder.png" id="previewImage" alt="Preview">

                        <input type="file" id="productImage" accept="image/*">

                    </div>

                </div>


                <div class="form-group">

                    <label>Product Name</label>

                    <input type="text" id="productName" placeholder="Enter Product Name">

                </div>

                <div class="form-group">

                    <label>Category</label>

                    <select id="category">

                        <option>Luxury Sofa</option>

                        <option>Wooden Sofa</option>

                        <option>Recliner Sofa</option>

                        <option>Fabric Sofa</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Price (₹)</label>

                    <input type="number" id="price" placeholder="Enter Price">

                </div>

                <div class="form-group">

                    <label>Stock</label>

                    <input type="number" id="stock" placeholder="Available Quantity">

                </div>

                <div class="form-group">

                    <label>Brand</label>

                    <input type="text" id="brand" placeholder="Brand Name">

                </div>

                <div class="form-group">

                    <label>Material</label>

                    <input type="text" id="material" placeholder="Leather / Wood / Fabric">

                </div>

                <div class="form-group">

                    <label>Color</label>

                    <input type="text" id="color" placeholder="Brown">

                </div>

                <div class="form-group">

                    <label>Status</label>

                    <select id="status">

                        <option>Available</option>

                        <option>Out of Stock</option>

                    </select>

                </div>

                <div class="form-group full-width">

                    <label>Description</label>

                    <textarea id="description" rows="5" placeholder="Enter Product Description"></textarea>

                </div>

                <div class="button-group full-width">

                    <button type="reset" class="cancel-btn">Cancel</button>

                    <button type="submit" class="save-btn">

                        <i class="fa-solid fa-floppy-disk"></i>Save Product

                    </button>

                </div>

            </form>

        </main>

    </div>

    <script src="/Add-Products/add-products.js"></script>

</body>

</html>
