<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Categories Management</title>

    <link rel="stylesheet" href="/Frontend Program/Admin-Categories/admin-categories.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="admin-container">

        <aside class="sidebar">

            <div class="sidebar-logo">

                <div class="logo-icon">L</div>

                <h2>LuxeCraft</h2>

            </div>

            <ul class="sidebar-menu">

                <li>
                    <a href="/Frontend Program/Dashboard/dashboard.html">
                        <i class="fa-solid fa-house"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Admin-Products/admin-products.html">
                        <i class="fa-solid fa-box"></i>
                        Products
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Admin-Orders/admin-orders.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Orders
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Admin-Customers/admin-customers.html">
                        <i class="fa-solid fa-users"></i>
                        Customers
                    </a>
                </li>

                <li class="active">
                    <a href="/Frontend Program/Admin-Categories/admin-categories.html">
                        <i class="fa-solid fa-layer-group"></i>
                        Categories
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Admin-Reports/admin-reports.html">
                        <i class="fa-solid fa-chart-line"></i>
                        Reports
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Admin-Settings/admin-setting.html">
                        <i class="fa-solid fa-gear"></i>
                        Settings
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Login Page/login.html">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </a>
                </li>

            </ul>

        </aside>

        <main class="main-content">

            <div class="top-header">

                <div>

                    <h1>Categories Management</h1>

                    <p>Manage all sofa categories.</p>

                </div>

                <button class="add-category-btn" id="add-category">

                    <i class="fa-solid fa-plus"></i>Add Category

                </button>

            </div>

            <!-- Toolbar -->

            <div class="toolbar">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text" id="search" placeholder="Search Category">

                </div>

            </div>

            <!-- Table -->

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Category ID</th>

                            <th>Category Name</th>

                            <th>Description</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="categoryTableBody">

                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="/Frontend Program/Admin-Categories/admin-categories.js"></script>

</body>

</html>
