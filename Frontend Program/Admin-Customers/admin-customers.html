<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customers Management</title>

    <link rel="stylesheet" href="/Frontend Program/Admin-Customers/admin-customers.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="admin-container">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-logo">

                <div class="logo-icon">L</div>

                <h2>LuxeCraft</h2>

            </div>

            <ul class="sidebar-menu">

                <li>
                    <a href="/Frontend Program/Dashboard/dashboard.html">
                        <i class="fa-solid fa-house"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Admin-Products/admin-products.html">
                        <i class="fa-solid fa-box"></i>
                        Products
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Admin-Orders/admin-orders.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Orders
                    </a>
                </li>

                <li class="active">
                    <a href="/Frontend Program/Admin-Customers/admin-customers.html">
                        <i class="fa-solid fa-users"></i>
                        Customers
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Admin-Categories/admin-categories.html">
                        <i class="fa-solid fa-layer-group"></i>
                        Categories
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Admin-Reports/admin-reports.html">
                        <i class="fa-solid fa-chart-line"></i>
                        Reports
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Admin-Settings/admin-setting.html">
                        <i class="fa-solid fa-gear"></i>
                        Settings
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Login Page/login.html">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </a>
                </li>

            </ul>

        </aside>

        <!-- Main Content -->

        <main class="main-content">

            <div class="top-header">

                <div>

                    <h1>Customers Management</h1>

                    <p>Manage all registered customers.</p>

                </div>

                <!-- <button class="add-btn" id="addCustomer">

                    <i class="fa-solid fa-user-plus"></i>

                    Add Customer

                </button> -->

            </div>

            <!-- Toolbar -->

            <div class="toolbar">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text" id="search" placeholder="Search Customer">

                </div>

                <div class="category-wrapper">
                    <select class="category-filter" id="statusFilter">
                        <option value="all">All Customers</option>
                        <option value="active">Active</option>

                        <option value="inactive">Inactive</option>

                    </select>
                    <i class="fa-solid fa-chevron-down"></i>

                </div>

            </div>

            <!-- Table -->

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <!-- <th>Image</th> -->

                            <th>Name</th>

                            <th>Email</th>

                            <th>Phone</th>

                            <th>Orders</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="customerTableBody">

                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="/Frontend Program/Admin-Customers/admin-customers.js"></script>

</body>

</html>
