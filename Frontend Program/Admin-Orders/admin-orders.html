<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders Management</title>

    <link rel="stylesheet" href="/Frontend Program/Admin-Orders/admin-Orders.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="admin-container">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-logo">

                <div class="logo-icon">L</div>

                <h2>LuxeCraft</h2>

            </div>

            <ul class="sidebar-menu">

                <li>
                    <a href="/Frontend Program/Dashboard/dashboard.html">
                        <i class="fa-solid fa-house"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Admin-Products/admin-products.html">
                        <i class="fa-solid fa-box"></i>
                        Products
                    </a>
                </li>

                <li class="active">
                    <a href="/Frontend Program/Admin-Orders/admin-orders.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Orders
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Admin-Customers/admin-customers.html">
                        <i class="fa-solid fa-users"></i>
                        Customers
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Admin-Categories/admin-categories.html">
                        <i class="fa-solid fa-layer-group"></i>
                        Categories
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Admin-Reports/admin-reports.html">
                        <i class="fa-solid fa-chart-line"></i>
                        Reports
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Admin-Settings/admin-setting.html">
                        <i class="fa-solid fa-gear"></i>
                        Settings
                    </a>
                </li>

                <li>
                    <a href="/Frontend Program/Login Page/login.html">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </a>
                </li>

            </ul>

        </aside>
        <!-- Main Content -->

        <main class="main-content">

            <div class="top-header">

                <div>

                    <h1>Orders Management</h1>

                    <p>Manage all customer orders.</p>

                </div>

            </div>

            <!-- Toolbar -->

            <div class="toolbar">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text" id="search" placeholder="Search Order">

                </div>

                <div class="category-wrapper">
                    <select class="category-filter" id="category">

                        <option>All Orders</option>

                        <option>Pending</option>

                        <option>In Progress</option>

                        <option>Delivered</option>

                        <option>Cancelled</option>

                    </select>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>

            </div>

            <!-- Orders Table -->

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Order ID</th>

                            <th>Customer</th>

                            <th>Product</th>

                            <th>Date</th>

                            <th>Amount</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="orderTableBody">

                        <tr>

                            <td colspan="7" style="text-align:center;">
                                Loading orders...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="../Admin-Orders/admin-Orders.js"></script>

</body>

</html>
