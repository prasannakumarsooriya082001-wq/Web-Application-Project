<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Page</title>
    <link rel="stylesheet" href="/Frontend Program/Product Page/products.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <header class="navbar">

        <div class="container">

            <div class="logo">

                <div class="logo-icon">L</div>

                <h2>LuxeCraft</h2>

            </div>


            <nav>

                <ul class="nav-links">

                    <li>
                        <a href="../Main Page/index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="../Product Page/products.html">
                            Sofas
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            About
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>


            <div class="nav-right">

                <button class="icon-btn" id="searchButton">
                    🔍
                </button>


                <button class="icon-btn cart" id="cart-btn">

                    🛒

                    <span class="badge" id="cartBadge">
                        0
                    </span>

                </button>


                <button class="login-btn" id="login-btn">
                    Login
                </button>


                <button class="signup-btn" id="signup-btn">
                    Sign Up
                </button>

            </div>

        </div>

    </header>


    <section class="breadcrumb">

        <div class="breadcrumb-container">

            <a href="/Frontend Program/Main Page/index.html">Home</a>

            <span>/</span>

            <a href="/Frontend Program/Product Page/products.html">Products</a>

        </div>

    </section>

    <!-- ********************************************************* search ************************************************************* -->

    <section class="product-controls">

        <input type="text" id="searchInput" placeholder="Search sofas..." class="search-box">


        <div class="select-wrapper">
            <select class="category-filter" id="categoryFilter">
                <option value="all">All Categories</option>
            </select>
            <i class="fa-solid fa-chevron-down"></i>

        </div>

    </section>

    <!-- ************************************************************************************************************************ -->

    <section class="products">

        <div class="section-title">
            <h2>Our Premium Collection</h2>
            <p>Discover handcrafted luxury sofas for every home.</p>
        </div>

        <div class="product-grid" id="productGrid"></div>

    </section>

    <!-- *********************************************************************************************************** -->

    <section class="pagination">

        <button>←</button>

        <button class="active">1</button>

        <button>2</button>

        <button>3</button>

        <button>→</button>

    </section>

    <script src="/Frontend Program/Product Page/products.js"></script>
</body>

</html>
