<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Success</title>

    <link rel="stylesheet" href="../Order-Success/Order-Success.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <header class="navbar">

        <div class="container">

            <div class="logo">

                <div class="logo-icon">L</div>

                <h2>LuxeCraft</h2>

            </div>

            <nav>

                <ul class="nav-links">

                    <li><a href="/Main Page/index.html">Home</a></li>
                    <li><a href="/Product Page/products.html">Sofas</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>

                </ul>

            </nav>

            <div class="nav-right">

                <button class="icon-btn1">🔍</button>

                <button class="icon-btn1 cart1">🛒<span class="badge">2</span></button>

                <button class="login-btn1">Login</button>

                <button class="signup-btn1">Sign Up</button>

            </div>

        </div>

    </header>



    <!-- Success Section -->

    <section class="success-section">

        <div class="success-card">

            <div class="success-icon">

                <i class="fa-solid fa-circle-check"></i>

            </div>

            <h1>Order Placed Successfully!</h1>

            <p>

                Thank you for shopping with <strong>LuxeCraft</strong>.

                Your order has been confirmed successfully.

            </p>

            <div class="order-info">

                <div>

                    <span>Order ID</span>

                    <h3 id="orderId">Loading...</h3>

                </div>

                <div>

                    <span>Estimated Delivery</span>

                    <h3>3 - 5 Business Days</h3>

                </div>

            </div>

            <div class="buttons">

                <a href="../Product Page/products.html" class="shop-btn">

                    Continue Shopping

                </a>

                <a href="../Orders Page/order.html" class="order-btn">

                    View Orders

                </a>

            </div>

        </div>

    </section>

    <script src="../Order-Success/Order-Success.js"></script>

</body>

</html>
