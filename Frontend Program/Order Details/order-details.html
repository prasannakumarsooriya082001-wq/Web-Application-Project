<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Details</title>

    <link rel="stylesheet" href="../Order Details/order-details.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="navbar">

        <div class="logo">

            <div class="logo-icon">L</div>

            <h2>LuxeCraft</h2>

        </div>

        <nav>

            <a href="../Main Page/index.html">Home</a>

            <a href="../Product Page/products.html">Sofas</a>

            <a href="../Orders Page/order.html">My Orders</a>

        </nav>

    </header>


    <!-- ================= PAGE TITLE ================= -->

    <section class="page-title">

        <h1>Order Details</h1>

        <p>View your order information and delivery details.</p>

    </section>


    <!-- ================= ORDER DETAILS ================= -->

    <section class="order-details-container">

        <div class="order-card">

            <div class="order-header">

                <div>

                    <span>Order ID</span>

                    <h2 id="orderId">#---</h2>

                </div>

                <div>

                    <span>Status</span>

                    <h3 id="orderStatus">---</h3>

                </div>

            </div>


            <!-- CUSTOMER DETAILS -->

            <div class="details-section">

                <h2>Customer Details</h2>

                <p>
                    <strong>Name:</strong>
                    <span id="customerName"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span id="customerEmail"></span>
                </p>

                <p>
                    <strong>Phone:</strong>
                    <span id="customerPhone"></span>
                </p>

            </div>


            <!-- SHIPPING ADDRESS -->

            <div class="details-section">

                <h2>Shipping Address</h2>

                <p id="shippingAddress"></p>

            </div>


            <!-- PAYMENT -->

            <div class="details-section">

                <h2>Payment</h2>

                <p>
                    <strong>Payment Method:</strong>
                    <span id="paymentMethod"></span>
                </p>

            </div>


            <!-- ================= ORDER ITEMS ================= -->

            <div class="details-section">

                <h2>Ordered Items</h2>

                <div id="orderItems">

                    <!-- Products will come from database -->

                </div>

            </div>


            <!-- ORDER SUMMARY -->

            <div class="details-section">

                <h2>Order Summary</h2>

                <div class="summary-row">

                    <span>Subtotal</span>

                    <span id="subtotal">
                        ₹0.00
                    </span>

                </div>

                <div class="summary-row">

                    <span>Tax</span>

                    <span id="tax">
                        ₹0.00
                    </span>

                </div>

                <div class="summary-row total">

                    <span>Total</span>

                    <span id="totalAmount">
                        ₹0.00
                    </span>

                </div>

            </div>


            <button class="back-btn" onclick="window.location.href='../Orders Page/order.html'">

                Back to My Orders

            </button>

        </div>

    </section>


    <script src="../Order Details/order-details.js"></script>

</body>

</html>
