<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wishlist</title>

    <link rel="stylesheet" href="/Wishlist/Wishlist.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="container">

            <div class="logo">

                <div class="logo-icon">L</div>

                <h2>LuxeCraft</h2>

            </div>

            <nav>

                <ul class="nav-links">

                    <li><a href="#home">Home</a></li>
                    <li><a href="/html/products.html">Sofas</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>

                </ul>

            </nav>

            <div class="nav-right">

                <button class="icon-btn">🔍</button>

                <button class="icon-btn cart">🛒<span class="badge">2</span></button>

                <button class="login-btn">Login</button>

                <button class="signup-btn">Sign Up</button>

            </div>

        </div>

    </header>

    <!-- ================= BREADCRUMB =================

    <section class="breadcrumb">

        <div class="breadcrumb-container">

            <a href="/Main Page/index.html">Home</a>

            <span>/</span>

            <span>Wishlist</span>

        </div>

    </section> -->

    <!-- ================= TITLE ================= -->

    <section class="wishlist-title">

        <h1>My Wishlist</h1>

        <p>Save your favorite luxury sofas and purchase them anytime.</p>

    </section>

    <!-- ================= WISHLIST ================= -->

    <section class="wishlist-section">

        <div class="wishlist-container">

            <!-- Card 1 -->

            <div class="wishlist-card">

                <img src="/images/sofa1.jpg" alt="">

                <div class="wishlist-details">

                    <h3>Modern Luxury Sofa</h3>

                    <p>
                        Premium leather sofa with elegant comfort and timeless design.
                    </p>

                    <h4>$899</h4>

                    <div class="wishlist-buttons">

                        <button class="view-btn">

                            View Details

                        </button>

                        <button class="cart-btn">

                            Add To Cart

                        </button>

                        <button class="remove-btn">

                            Remove

                        </button>

                    </div>

                </div>

            </div>

            <!-- Card 2 -->

            <div class="wishlist-card">

                <img src="/images/sofa2.jpg" alt="">

                <div class="wishlist-details">

                    <h3>Royal Sofa</h3>

                    <p>
                        Luxury wooden sofa crafted for premium living rooms.
                    </p>

                    <h4>$1299</h4>

                    <div class="wishlist-buttons">

                        <button class="view-btn">

                            View Details

                        </button>

                        <button class="cart-btn">

                            Add To Cart

                        </button>

                        <button class="remove-btn">

                            Remove

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- ================= FOOTER ================= -->

    <footer>

        <!-- Same Footer -->

    </footer>

    <script src="/Wishlist/wishlist.js"></script>

</body>

</html>
